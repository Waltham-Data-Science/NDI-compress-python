name: Build binaries from NDI-compress

# Builds the NDI compression executables from Waltham-Data-Science/NDI-compress
# on Linux, macOS (universal: arm64 + x86_64) and Windows, tests this package
# with them on each platform, and commits them into src/ndicompress/bin/ on the
# branch the workflow ran on.
#
# Which NDI-compress commit to build is recorded in ndi-compress-ref.txt:
#   - push a change to that file (on any branch) to rebuild from that commit, or
#   - run this workflow by hand (Actions > Build binaries from NDI-compress >
#     Run workflow), optionally naming a branch, tag or commit; the file is
#     updated to the commit that was built.
#
# The commit is made with GITHUB_TOKEN, so it does not trigger other workflows
# (test.yml): the tests that matter run here, on the new binaries, before
# anything is committed.

on:
  workflow_dispatch:
    inputs:
      ndi_compress_ref:
        description: "NDI-compress branch, tag or commit to build (blank: the one in ndi-compress-ref.txt)"
        required: false
        default: ""
  push:
    paths:
      - ndi-compress-ref.txt

permissions:
  contents: write

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the NDI-compress commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        shell: bash
        env:
          INPUT_REF: ${{ github.event.inputs.ndi_compress_ref }}
        run: |
          ref="${INPUT_REF:-$(tr -d '[:space:]' < ndi-compress-ref.txt)}"
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$ref"
          else
            sha=$(git ls-remote https://github.com/Waltham-Data-Science/NDI-compress.git \
                  "refs/heads/$ref" "refs/tags/$ref" | head -n1 | cut -f1)
          fi
          if [[ -z "$sha" ]]; then
            echo "Could not resolve NDI-compress ref '$ref' (use a branch, tag or full commit hash)." >&2
            exit 1
          fi
          echo "Building NDI-compress $ref = $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test on ${{ matrix.os }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # 22.04 rather than latest: the Linux binaries need the glibc of the
          # system they are built on, so an older one runs on more systems.
          - os: ubuntu-22.04
            bindir: linux
            exe: ""
          - os: macos-latest
            bindir: macos
            exe: ""
          - os: windows-latest
            bindir: windows
            exe: ".exe"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this package
        uses: actions/checkout@v4
        with:
          path: pkg

      - name: Check out NDI-compress
        uses: actions/checkout@v4
        with:
          repository: Waltham-Data-Science/NDI-compress
          ref: ${{ needs.resolve.outputs.sha }}
          path: ndi-compress

      - uses: jwlawson/actions-setup-cmake@v2

      - name: Configure (Windows, MinGW)
        if: runner.os == 'Windows'
        run: cmake -S ndi-compress/C -B build -G "MinGW Makefiles"

      - name: Configure (Linux, macOS)
        if: runner.os != 'Windows'
        run: cmake -S ndi-compress/C -B build

      - name: Build
        run: cmake --build build

      - name: C tests
        run: ctest --test-dir build --output-on-failure

      - name: Put the executables in the package
        run: |
          dest="pkg/src/ndicompress/bin/${{ matrix.bindir }}"
          mkdir -p "$dest"
          for name in ndi_compress_digital ndi_compress_ephys ndi_compress_time \
                      ndi_compress_metadata ndi_compress_eventmarktext \
                      ndi_uncompress_digital ndi_uncompress_ephys ndi_uncompress_time \
                      ndi_uncompress_metadata ndi_uncompress_eventmarktext \
                      compare_json compare_double; do
            cp "build/${name}${{ matrix.exe }}" "$dest/"
          done
          chmod +x "$dest"/* || true
          ls -l "$dest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test the package with the new executables
        working-directory: pkg
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.bindir }}
          path: pkg/src/ndicompress/bin/${{ matrix.bindir }}
          if-no-files-found: error

  commit:
    name: Commit the executables
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts

      - name: Replace src/ndicompress/bin
        run: |
          for dir in linux macos windows; do
            rm -rf "src/ndicompress/bin/$dir"
            mkdir -p "src/ndicompress/bin/$dir"
            cp artifacts/bin-$dir/* "src/ndicompress/bin/$dir/"
          done
          chmod +x src/ndicompress/bin/linux/* src/ndicompress/bin/macos/*
          echo "${{ needs.resolve.outputs.sha }}" > ndi-compress-ref.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ndicompress/bin ndi-compress-ref.txt
          if git diff --cached --quiet; then
            echo "The binaries are already those of NDI-compress ${{ needs.resolve.outputs.sha }}."
            exit 0
          fi
          git commit -m "Binaries from NDI-compress ${{ needs.resolve.outputs.sha }}" \
                     -m "Built and tested on Linux, macOS and Windows by the build-binaries workflow (run ${{ github.run_id }})."
          git push origin "HEAD:${{ github.ref_name }}"
