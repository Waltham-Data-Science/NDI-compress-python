name: Test NDI Compress

on:
  push:
    branches: [ main, master, 'exp/**' ]
  pull_request:
    branches: [ main, master, 'exp/**' ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Widened beyond 3.10 to prove the tarfile portability fix
        # (extractfile() + fixed filename, no filter= keyword) across the
        # requires-python>=3.7 range.
        python-version: ['3.9', '3.10', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      run: |
        pytest
